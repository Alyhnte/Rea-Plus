# rea-plus Docker imaji: release'de GHCR'a basilir; elle tetiklemede varsayilan yalniz build dogrulamasi.
name: docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: "GHCR'a pushla (false = yalniz build)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: GHCR girisi (yalniz push'lu kosularda)
        if: github.event_name == 'release' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alyhnte/reaplus
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch

      - name: Build (ve kosula gore push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'release' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
