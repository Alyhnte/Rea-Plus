# rea-plus Docker imaji: release'de GHCR'a basilir; elle tetiklemede varsayilan yalniz build dogrulamasi.
name: docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: "GHCR'a pushla (false = yalniz build)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: GHCR girisi (yalniz push'lu kosularda)
        if: github.event_name == 'release' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alyhnte/reaplus
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch

      - name: Smoke (elle tetiklemede imaji gercekten calistir)
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker build -t rea-plus:smoke .
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' > /tmp/init.jsonl
          timeout 25 docker run --rm -i rea-plus:smoke < /tmp/init.jsonl > /tmp/out.txt 2>/tmp/err.txt || true
          cat /tmp/out.txt
          cat /tmp/err.txt
          grep -q 'rea-plus' /tmp/out.txt

      - name: Build (ve kosula gore push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'release' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
