# rea-plus publish zinciri — TEK tetikleyici: v* tag push.
# Sira: kapilar (typecheck/build/test) -> npm publish (NPM_TOKEN secret) ->
# npm'de surum gorunene kadar yoklama -> MCP Registry publish (GitHub OIDC).
# Manuel publish-registry workflow'u emeklidir; cift-kosucu yarisi bitti,
# duplicate-version gürültüsü olmaz. Kuru prova için: tag açmadan önce yerelde
# `npm publish` provası koşulur (CI'da prova job'u yoktur).
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22 kur (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Temiz kurulum (npm ci)
        run: npm ci

      - name: Tip denetimi
        run: npm run typecheck

      - name: Derle
        run: npm run build

      - name: Testler
        run: npm test

      - name: Publish kontrol
        run: |
          node --test tests/publish.test.mjs tests/version-sync.test.mjs tests/publish-workflow.test.mjs
          node scripts/publish-kontrol.mjs

      - name: npm publish (NPM_TOKEN secret)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-registry:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: npm gorunurluk bekleme
        run: |
          SURUM="${GITHUB_REF#refs/tags/v}"
          echo "Beklenen npm surumu: $SURUM"
          for i in $(seq 1 30); do
            GORUNEN="$(npm view rea-plus version 2>/dev/null || true)"
            if [ "$GORUNEN" = "$SURUM" ]; then
              echo "npm'de gorundu: $GORUNEN (deneme $i)"
              exit 0
            fi
            echo "deneme $i: henuz yok (gorunen: $GORUNEN), 20sn bekleniyor..."
            sleep 20
          done
          echo "::error::npm'de $SURUM 10dk icinde gorunmedi; registry yayini durduruldu."
          exit 1

      - name: mcp-publisher kur
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: server.json dogrula
        run: ./mcp-publisher validate

      - name: Registry girisi (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Registry yayini
        run: ./mcp-publisher publish
